<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wireframe — VoxReady</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#17354F; --accentsoft:#e4eaf1; --accent2:#DB6427;
    --bg:#f4f4f2; --sidebar:#fbfbfa; --panel:#ffffff; --ink:#22303c; --muted:#8a8a8a;
    --line:#cfcfcf; --line2:#b5b5b5; --soft:#eef0f2; --barfill:#e2e2df; --stat:#fafafa;
    --chrome2:#edeef0; --note:#fff5ec; --noteline:#f0c49e; --notetext:#9c5320;
    --ph1:#f0f0ee; --ph2:#e8e8e5; --topbar:#ffffff;
  }
  [data-palette="voxready"]{--accent:#17354F; --accentsoft:#e4eaf1;}
  [data-palette="teal"]{--accent:#0f6e56; --accentsoft:#dcf1ea;}
  [data-palette="coral"]{--accent:#b1502b; --accentsoft:#f7e6dd;}
  [data-palette="violet"]{--accent:#534ab7; --accentsoft:#eae8fa;}
  [data-theme="dark"]{
    --bg:#15191d; --sidebar:#1b2128; --panel:#222a31; --ink:#e7eaed; --muted:#9aa3ab;
    --line:#374049; --line2:#475159; --soft:#2a333b; --barfill:#3a444d; --stat:#262f37;
    --chrome2:#2a333b; --note:#2f2719; --noteline:#5e4a26; --notetext:#e3b483;
    --ph1:#283038; --ph2:#222a31; --topbar:#1b2128; --accentsoft:#26384a;
  }
  [data-theme="dark"][data-palette="teal"]{--accentsoft:#1f352e;}
  [data-theme="dark"][data-palette="coral"]{--accentsoft:#3a2a22;}
  [data-theme="dark"][data-palette="violet"]{--accentsoft:#2c2945;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Poppins','Segoe UI',Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;}
  .topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;height:58px;padding:0 18px;background:var(--topbar);border-bottom:1px solid var(--line);gap:14px;}
  .tb-title{font-size:13px;color:var(--muted);}
  .tb-right{margin-left:auto;display:flex;align-items:center;gap:16px;}
  .ctrl{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);}
  select.lang{height:30px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font-size:12px;padding:0 8px;font-family:inherit;}
  .iconbtn{width:32px;height:32px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .iconbtn:hover{background:var(--soft);}
  .swatches{display:flex;gap:6px;}
  .sw{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
  .sw.on{border-color:var(--ink);}
  .logo-slot{height:40px;padding:4px 9px;border:1px solid var(--line2);border-radius:7px;display:flex;align-items:center;justify-content:center;background:#ffffff;}
  .app{display:flex;min-height:calc(100vh - 58px);}
  .sidebar{width:262px;background:var(--sidebar);border-right:1px solid var(--line);padding:14px 0;position:sticky;top:58px;height:calc(100vh - 58px);overflow-y:auto;flex-shrink:0;}
  .brand{padding:0 18px 14px;border-bottom:1px solid var(--line);margin-bottom:10px;}
  .brandlogo-wrap{background:#fff;border-radius:8px;padding:6px 9px;display:inline-block;}
  .brand p{font-size:11px;color:var(--muted);margin:7px 0 0;}
  .role{padding:14px 18px 4px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;}
  .navitem{display:flex;align-items:center;gap:9px;padding:8px 18px;cursor:pointer;font-size:13px;color:var(--ink);border-left:3px solid transparent;}
  .navitem:hover{background:var(--soft);}
  .navitem.active{background:var(--accentsoft);border-left-color:var(--accent);color:var(--accent);font-weight:600;}
  .navitem .n{width:20px;height:20px;border-radius:50%;background:var(--barfill);color:var(--muted);font-size:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .navitem.active .n{background:var(--accent);color:#fff;}
  .main{flex:1;padding:26px 30px 60px;overflow-x:hidden;}
  .crumbs{font-size:12px;color:var(--muted);margin-bottom:4px;}
  .screen-title{font-size:20px;font-weight:600;margin:0 0 2px;}
  .screen-sub{font-size:13px;color:var(--muted);margin:0 0 18px;}
  .chrome{background:var(--panel);border:1px solid var(--line2);border-radius:8px;overflow:hidden;}
  .chrome-bar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--chrome2);border-bottom:1px solid var(--line);}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--line);}
  .urlbar{flex:1;margin-left:8px;background:var(--panel);border:1px solid var(--line);border-radius:5px;font-size:11px;color:var(--muted);padding:4px 10px;}
  .canvas{padding:20px;}
  .ph{background:repeating-linear-gradient(135deg,var(--ph1),var(--ph1) 7px,var(--ph2) 7px,var(--ph2) 14px);border:1px dashed var(--line2);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;text-align:center;}
  .box{border:1px solid var(--line);border-radius:6px;background:var(--panel);}
  .soft{background:var(--soft);}
  .bar{height:11px;background:var(--barfill);border-radius:3px;}
  .bar.s{width:55%;} .bar.m{width:75%;} .bar.l{width:92%;}
  .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--panel);border-radius:6px;padding:7px 14px;font-size:12px;color:var(--ink);cursor:pointer;font-family:inherit;}
  .btn.pri{background:var(--accent2);color:#fff;border-color:var(--accent2);}
  .btn.nav{background:var(--accent);color:#fff;border-color:var(--accent);}
  .btn.ghost{background:transparent;}
  .btn.disabled{opacity:.4;cursor:not-allowed;pointer-events:none;}
  .pill{display:inline-block;border:1px solid var(--line2);border-radius:999px;padding:3px 11px;font-size:11px;color:var(--ink);background:var(--panel);}
  .pill.on{background:var(--accentsoft);border-color:var(--accent);color:var(--accent);}
  .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin-bottom:6px;}
  .field{border:1px solid var(--line);border-radius:6px;height:34px;background:var(--panel);display:flex;align-items:center;padding:0 10px;color:var(--muted);font-size:12px;}
  .area{border:1px solid var(--line);border-radius:6px;background:var(--panel);min-height:64px;padding:10px;color:var(--muted);font-size:12px;}
  .row{display:flex;gap:14px;}
  .col{flex:1;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .card{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:14px;}
  .scard{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:13px;display:flex;flex-direction:column;}
  .scard h4{margin:0 0 4px;font-size:14px;font-weight:600;}
  .scard .ctx{font-size:12px;color:var(--muted);margin:0 0 9px;line-height:1.4;}
  .meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:11px;}
  .tagm{font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:2px 7px;}
  .stat{border:1px solid var(--line);border-radius:8px;background:var(--stat);padding:12px 14px;}
  .stat .k{font-size:11px;color:var(--muted);}
  .stat .v{font-size:22px;font-weight:600;margin-top:3px;color:var(--accent);}
  .note{background:var(--note);border:1px solid var(--noteline);border-radius:7px;padding:11px 13px;font-size:12px;color:var(--notetext);margin-top:16px;}
  table.wf{width:100%;border-collapse:collapse;font-size:12px;}
  table.wf th,table.wf td{border:1px solid var(--line);padding:8px 10px;text-align:left;color:var(--ink);}
  table.wf th{background:var(--soft);color:var(--muted);font-weight:600;}
  .vid{position:relative;border:1px solid var(--line2);border-radius:8px;min-height:230px;background:#202830;display:flex;align-items:center;justify-content:center;color:#aab4bd;font-size:13px;overflow:hidden;}
  .vid .tag{position:absolute;top:8px;left:10px;background:rgba(255,255,255,.12);color:#eee;font-size:11px;padding:3px 9px;border-radius:5px;}
  .self{position:relative;border:1px solid var(--line2);border-radius:8px;min-height:230px;background:#323b43;display:flex;align-items:center;justify-content:center;color:#cdd4da;font-size:13px;overflow:hidden;}
  .reclamp{position:absolute;top:8px;right:10px;display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.4);padding:3px 9px;border-radius:5px;color:#fff;font-size:11px;}
  .recdot{width:8px;height:8px;border-radius:50%;background:#e24b4a;}
  .meter{height:9px;border-radius:5px;background:var(--barfill);overflow:hidden;}
  .meter > i{display:block;height:100%;background:var(--accent);border-radius:5px;}
  .areaScore{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--panel);}
  .areaScore .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
  .areaScore .name{font-size:13px;font-weight:600;}
  .areaScore .sc{font-size:18px;font-weight:700;color:var(--accent);}
  .legend{font-size:11px;color:var(--muted);margin-top:6px;}
  .consent{width:16px;height:16px;accent-color:var(--accent2);margin:1px 0 0;flex-shrink:0;}
  .calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .calgrid .dow{font-size:10px;color:var(--muted);text-align:center;padding-bottom:2px;}
  .calday{text-align:center;padding:7px 0;border-radius:6px;cursor:pointer;font-size:12px;border:1px solid transparent;color:var(--ink);}
  .calday:hover{background:var(--soft);}
  .calday.sel{background:var(--accent2);color:#fff;font-weight:600;}
  /* ===== user chip + logout (topbar) ===== */
  .userchip{display:flex;align-items:center;gap:10px;}
  .userchip .uava{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .userchip .umeta{display:flex;flex-direction:column;line-height:1.2;}
  .userchip .uname{font-size:12px;font-weight:600;color:var(--ink);}
  .userchip .urole{font-size:10.5px;color:var(--muted);}
  .logoutbtn{height:30px;border:1px solid var(--line2);border-radius:6px;background:var(--panel);color:var(--ink);font-size:12px;padding:0 12px;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:6px;}
  .logoutbtn:hover{background:var(--soft);}
  /* ===== login screen ===== */
  .login{min-height:calc(100vh - 58px);display:flex;align-items:center;justify-content:center;padding:40px 20px;}
  .login-card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:32px 30px;box-shadow:0 8px 30px rgba(0,0,0,.06);}
  .login-logo{display:flex;justify-content:center;margin-bottom:18px;}
  .login-logo .brandlogo-wrap{background:#fff;border-radius:10px;padding:8px 12px;}
  .login-title{font-size:20px;font-weight:600;text-align:center;margin:0 0 4px;}
  .login-sub{font-size:13px;color:var(--muted);text-align:center;margin:0 0 22px;}
  .login-field{margin-bottom:14px;}
  .login-field label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin-bottom:6px;}
  .login-input{width:100%;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font-size:13px;padding:0 12px;font-family:inherit;}
  .login-input:focus{outline:none;border-color:var(--accent);}
  .login-btn{width:100%;height:42px;border:none;border-radius:8px;background:var(--accent2);color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:6px;}
  .login-btn:hover{filter:brightness(1.05);}
  .login-err{font-size:12px;color:#c0392b;margin:8px 0 0;min-height:16px;text-align:center;}
  .login-divider{display:flex;align-items:center;gap:10px;margin:22px 0 14px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;}
  .login-divider::before,.login-divider::after{content:"";flex:1;height:1px;background:var(--line);}
  .tu{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:11px 13px;cursor:pointer;font-family:inherit;margin-bottom:9px;}
  .tu:hover{border-color:var(--accent);background:var(--accentsoft);}
  .tu .tuava{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .tu .tumeta{flex:1;min-width:0;}
  .tu .tuname{font-size:13px;font-weight:600;color:var(--ink);}
  .tu .turole{font-size:11px;color:var(--muted);}
  .tu .tugo{font-size:16px;color:var(--muted);}
</style>
</head>

      <select class="lang" id="lang">
        <option value="es">Español</option>
        <option value="en">English</option>
        <option value="pt">Português</option>
      </select>

      <div class="swatches" id="swatches">

</header>

<div class="login" id="loginView"></div>

<div class="app" id="appView" style="display:none;">

  <main class="main" id="main"></main>
</div>

/* ============ chart helper (SVG line chart) ============ */
function buildChart(){
  const W=600,H=190,pl=30,pr=10,pt=12,pb=22,n=CHARTDATA[0].length;
  const x=i=>Math.round(pl+i*(W-pl-pr)/(n-1));
  const y=v=>Math.round(pt+(100-v)/(100-30)*(H-pt-pb));
  let grid='';
  [40,60,80].forEach(g=>{grid+=`<line x1="${pl}" y1="${y(g)}" x2="${W-pr}" y2="${y(g)}" style="stroke:var(--line)" stroke-width="1"/><text x="4" y="${y(g)+3}" font-size="9" style="fill:var(--muted)">${g}</text>`;});
  let lines='';
  CHARTDATA.forEach((s,si)=>{
    const pts=s.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
    lines+=`<polyline points="${pts}" fill="none" stroke="${CHARTCOLORS[si]}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
    s.forEach((v,i)=>{lines+=`<circle cx="${x(i)}" cy="${y(v)}" r="2.8" fill="${CHARTCOLORS[si]}"/>`;});
  });
  let xl='';
  for(let i=0;i<n;i++) xl+=`<text x="${x(i)}" y="${H-6}" font-size="9" style="fill:var(--muted)" text-anchor="middle">S${i+1}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;">${grid}${lines}${xl}</svg>`;
}

        <div class="box" style="padding:9px;margin-bottom:7px;"><div class="bar s" style="margin-bottom:5px;"></div><span class="legend">${t.q2}</span></div>
        <div class="box" style="padding:9px;"><div class="bar s" style="margin-bottom:5px;"></div><span class="legend">${t.q3}</span></div>
      </div>
      <div class="card col">
        <div class="label">${t.caseL}</div>
        <div class="grid2" style="margin:8px 0 12px;">
          <div class="vid" style="min-height:120px;">${t.rec}</div>
          <div><div class="legend">${t.proposal}</div>
            ${t.areas.map((n,i)=>{const v=[70,81,79,58][i];return `<div style="display:flex;justify-content:space-between;font-size:12px;margin:5px 0;"><span>${n}</span><span><b>${v}</b> &nbsp;<input type="text" value="${v}" style="width:42px;border:1px solid var(--line);border-radius:4px;padding:2px 4px;background:var(--panel);color:var(--ink);"></span></div>`;}).join('')}
          </div>
        </div>
        <div class="label">${t.commentL}</div><div class="area" style="min-height:50px;"></div>
        <div style="display:flex;gap:10px;margin-top:12px;"><span class="btn pri">${t.confirm}</span><span class="btn ghost">${t.skip}</span></div>
      </div>
    </div>
    <div class="note"><b>${c.noteUX}</b> ${t.note}</div>`,
  lesson:(t,c,extra)=>`
    <div style="margin-bottom:12px;"><span class="btn ghost" onclick="go('u1')">${c.back}</span></div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;"><h4 style="margin:0;font-size:16px;">${extra}</h4><span class="tagm">${t.mins}</span></div>
      <div class="label">${t.objL}</div><p class="ctx" style="margin-bottom:14px;color:var(--muted);font-size:12px;">${t.obj}</p>
      <div class="ph" style="height:150px;margin-bottom:14px;">${t.vidL}</div>
      <div class="label">${t.exL}</div><div class="area" style="margin-bottom:16px;">${t.exV}</div>
      <span class="btn pri" onclick="go('u2')">${t.cta}</span>
    </div>
    <div class="note"><b>${c.noteUX}</b> ${t.note}</div>`
};

/* ============ render + state ============ */
let lang = 'es';
let cur = 'u1';
let lessonName = '';
const order = ["u1","beta","u2","u3","u4","u5","u6","u7","a1","a2","a3","m1","m2","m3"];
/* ===== auth: usuarios de prueba (uno por rol) y mapa de roles ===== */
const TEST_USERS = [
  {role:'user',   initials:'AT', name:'Ana Torres',  email:'ana@visum.com',     pass:'demo1234'},
  {role:'admin',  initials:'CR', name:'Carlos Ruiz',  email:'carlos@visum.com',  pass:'demo1234'},
  {role:'master', initials:'MV', name:'Marta Vidal',  email:'marta@voxready.io', pass:'demo1234'}
];
const ROLE_RANGE = { user:[0,8], admin:[8,11], master:[11,14] }; // índices en `order`/`nav`
const ROLE_RIDX  = { user:0, admin:1, master:2 };                 // índice en `roles`
const ROLE_HOME  = { user:'u1', admin:'a1', master:'m1' };        // pantalla inicial por rol
let session = null;
const main = document.getElementById('main');
const navWrap = document.getElementById('navWrap');
const loginView = document.getElementById('loginView');
const appView = document.getElementById('appView');
const now = new Date();
const calState = { y: now.getFullYear(), m: now.getMonth(), sel: null };

function buildNav(){
  const d = I[lang];
  if(!session){ navWrap.innerHTML=''; return; }
  const [a,b] = ROLE_RANGE[session.role];
  const label = d.roles[ROLE_RIDX[session.role]];
  let html = `<div class="role">${label}</div>`;
  for(let i=a;i<b;i++){
    html += `<div class="navitem" data-s="${order[i]}"><span class="n">${i-a+1}</span> ${d.nav[i]}</div>`;
  }
  navWrap.innerHTML = html;
  navWrap.querySelectorAll('.navitem').forEach(it=>it.addEventListener('click',()=>go(it.dataset.s)));
}
function go(id){ cur=id; render(); }

/* ===== auth: login / logout / pantalla de login ===== */
function updateUserChip(){
  if(!session) return;
  const d = I[lang], chip = document.getElementById('userChip');
  chip.style.display = 'flex';
  document.getElementById('uAva').textContent = session.initials;
  document.getElementById('uName').textContent = session.name;
  document.getElementById('uRole').textContent = d.roles[ROLE_RIDX[session.role]];
  document.getElementById('logoutLbl').textContent = d.login.logout;
}
function login(u){
  session = u;
  cur = ROLE_HOME[u.role];
  loginView.style.display = 'none';
  appView.style.display = 'flex';
  updateUserChip();
  buildNav();
  render();
}
function logout(){
  session = null;
  appView.style.display = 'none';
  document.getElementById('userChip').style.display = 'none';
  loginView.style.display = 'flex';
  renderLogin();
}
function submitLogin(){
  const email = (document.getElementById('loginEmail').value || '').trim().toLowerCase();
  const u = TEST_USERS.find(x => x.email.toLowerCase() === email);
  if(u){ login(u); }
  else { document.getElementById('loginErr').textContent = I[lang].login.err; }
}
function renderLogin(){
  const d = I[lang], lg = d.login;
  loginView.innerHTML = `
    <div class="login-card">
      <div class="login-logo"><span class="brandlogo-wrap"><img src="VoxReady_logo.png" alt="VoxReady" style="height:40px;display:block;"></span></div>
      <h1 class="login-title">${lg.title}</h1>
      <p class="login-sub">${lg.sub}</p>
      <div class="login-field"><label>${lg.emailL}</label><input class="login-input" id="loginEmail" type="email" autocomplete="username" placeholder="${lg.emailPh}"></div>
      <div class="login-field"><label>${lg.passL}</label><input class="login-input" id="loginPass" type="password" autocomplete="current-password" placeholder="${lg.passPh}"></div>
      <button class="login-btn" id="loginSubmit">${lg.signIn}</button>
      <p class="login-err" id="loginErr"></p>
      <div class="login-divider">${lg.testL}</div>
      ${TEST_USERS.map((u,i)=>`
        <button class="tu" data-i="${i}">
          <span class="tuava">${u.initials}</span>
          <span class="tumeta"><span class="tuname">${u.name}</span><span class="turole">${d.roles[ROLE_RIDX[u.role]]} · ${u.email}</span></span>
          <span class="tugo">→</span>
        </button>`).join('')}
    </div>`;
  loginView.querySelectorAll('.tu').forEach(b => b.addEventListener('click', () => login(TEST_USERS[+b.dataset.i])));
  document.getElementById('loginSubmit').addEventListener('click', submitLogin);
  document.getElementById('loginPass').addEventListener('keydown', e => { if(e.key === 'Enter') submitLogin(); });
}
function goLesson(name){ lessonName=name; cur='lesson'; render(); }

function wireConsent(){
  const cbs=[...document.querySelectorAll('.consent')];
  const btn=document.getElementById('beginBtn');
  if(!btn) return;
  function upd(){ btn.classList.toggle('disabled', !cbs.every(c=>c.checked)); }
  cbs.forEach(c=>c.addEventListener('change',upd));
  btn.addEventListener('click',()=>{ if(cbs.every(c=>c.checked)) go('u4'); });
  upd();
}

function drawCal(){
  const d=I[lang].L.u7;
  const first=new Date(calState.y,calState.m,1);
  const offset=(first.getDay()+6)%7;
  const days=new Date(calState.y,calState.m+1,0).getDate();
  let cells='';
  for(let i=0;i<offset;i++) cells+='<div></div>';
  for(let day=1;day<=days;day++){
    const sel=calState.sel && calState.sel.y===calState.y && calState.sel.m===calState.m && calState.sel.day===day;
    cells+=`<div class="calday${sel?' sel':''}" data-d="${day}">${day}</div>`;
  }
  const grid=document.getElementById('calGrid'); if(!grid) return;
  grid.innerHTML=cells;
  document.getElementById('calMonth').textContent=d.months[calState.m]+' '+calState.y;
  const lbl=document.getElementById('calSel');
  lbl.textContent= calState.sel ? (calState.sel.day+' '+d.months[calState.sel.m]) : d.calNone;
  grid.querySelectorAll('.calday').forEach(c=>c.addEventListener('click',()=>{
    calState.sel={y:calState.y,m:calState.m,day:+c.dataset.d}; drawCal();
  }));
}
function wireCalendar(){
  const prev=document.getElementById('calPrev'), next=document.getElementById('calNext');
  if(!prev) return;
  prev.addEventListener('click',()=>{ calState.m--; if(calState.m<0){calState.m=11;calState.y--;} drawCal(); });
  next.addEventListener('click',()=>{ calState.m++; if(calState.m>11){calState.m=0;calState.y++;} drawCal(); });
  drawCal();
}

function render(){
  const d = I[lang];
  const isLesson = cur==='lesson';
  const t = d.L[cur];
  const url = {u1:"app.voxready.io/inicio",beta:"app.voxready.io/beta",u2:"app.voxready.io/escenarios",u3:"app.voxready.io/sesion/preparar",u4:"app.voxready.io/sesion/en-vivo",u5:"app.voxready.io/sesion/procesando",u6:"app.voxready.io/informe/8842",u7:"app.voxready.io/progreso",a1:"admin.voxready.io/panel",a2:"admin.voxready.io/tema",a3:"admin.voxready.io/retencion",m1:"master.voxready.io/panel",m2:"master.voxready.io/rubrica",m3:"master.voxready.io/etiquetado",lesson:"app.voxready.io/leccion"}[cur];
  const body = isLesson ? TPL.lesson(t,d,lessonName) : TPL[cur](t,d);
  main.innerHTML = `
    <div class="crumbs">${t.crumbs}</div>
    <h2 class="screen-title">${isLesson?lessonName:t.title}</h2>
    <p class="screen-sub">${t.sub}</p>
    <div class="chrome">
      <div class="chrome-bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="urlbar">${url}</span></div>
      <div class="canvas">${body}</div>
    </div>`;
  navWrap.querySelectorAll('.navitem').forEach(it=>it.classList.toggle('active', it.dataset.s===cur));
  if(cur==='u3') wireConsent();
  if(cur==='u7') wireCalendar();
  window.scrollTo(0,0);
}
function applyLang(){
  const d = I[lang];
  document.documentElement.lang = lang;
  document.getElementById('tbTitle').textContent = d.tbTitle;
  document.getElementById('brandP').textContent = d.brandP;
  document.getElementById('palLabel').childNodes[0].textContent = d.palette+' ';
  document.getElementById('themeBtn').title = d.theme;
  if(session){ updateUserChip(); buildNav(); render(); }
  else { renderLogin(); }
}

document.getElementById('lang').addEventListener('change',e=>{ lang=e.target.value; applyLang(); });
document.getElementById('logoutBtn').addEventListener('click', logout);
const bodyEl = document.body, themeBtn = document.getElementById('themeBtn');
themeBtn.addEventListener('click',()=>{
  const dark = bodyEl.dataset.theme==='dark';
  bodyEl.dataset.theme = dark ? 'light' : 'dark';
  themeBtn.textContent = dark ? '🌙' : '☀️';
});
document.getElementById('swatches').addEventListener('click',e=>{
  const sw = e.target.closest('.sw'); if(!sw) return;
  bodyEl.dataset.palette = sw.dataset.p;
  document.querySelectorAll('.sw').forEach(x=>x.classList.toggle('on', x===sw));
});
applyLang();
</script>
</body>
</html>
